<body>
    <main>
        <svg id="hole-svg" viewBox="0 0 200 100">
      <path id="spiral" style="fill:none" d="M20 20L100 100" />
      <text> <textPath id="rabbit" href="#spiral">🐇</textPath>
      </text>
    </svg>

        <button>Show Path</button>
        <script>
            //down the hole code
            let svg = document.getElementById("hole-svg");
            let button = document.querySelector("button");
            button.addEventListener("click", show);

            let spiralPath = document.getElementById("spiral");
            let spiralLength = spiralPath.getTotalLength();
            let rabbit = document.getElementById("rabbit");
            let scrollPosition = 0;

            function updateTextPathOffset(offset) {
                rabbit.setAttribute("startOffset", offset);
            }

            function move() {
                let margin = 10; //this is to ensure the text goes beyond the end of the path

                requestAnimationFrame(function() {
                    let scrollPosition = window.scrollY;

                    if (scrollPosition <= spiralLength + margin) {
                        updateTextPathOffset(scrollPosition);
                    }
                });
            }

            function show() {
                spiralPath.classList.toggle("show");
            }

            window.addEventListener("scroll", move);
